# TEMPORARY diagnostic: can the workflow token create a (draft) release with tauri-action's exact fields? Removed right after the test.
name: Permission test (temporary)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Create a draft release with the same fields as tauri-action, then delete it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          cat > body.txt <<'EOF'
          PixelDebh: Retro-Rescue! v1.18.0

          What is new: https://github.com/Pitz72/PixelDebhTheGame/blob/v1.18.0/log/1.18.0.md

          Windows: install with the file ending in `-setup.exe`.
          EOF
          echo "--- same fields as tauri-action ---"
          gh api -i -X POST "repos/${{ github.repository }}/releases" \
            -f tag_name=v1.18.0 -f name="PixelDebh: Retro-Rescue! v1.18.0" -F body=@body.txt \
            -F draft=true -F prerelease=false -F generate_release_notes=false \
            -f target_commitish="${{ github.sha }}" 2>&1 | grep -E "^HTTP|^X-Accepted|^X-Github-Request-Id|\"message\"|\"errors\"|\"id\"" | head -12
          ID=$(gh api "repos/${{ github.repository }}/releases" --jq '.[]|select(.tag_name=="v1.18.0")|.id' 2>&1 | head -1)
          echo "id=$ID"
          if [ -n "$ID" ] && [ "$ID" -eq "$ID" ] 2>/dev/null; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/$ID" && echo "test release deleted"
          fi
