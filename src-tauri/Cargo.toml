[package]
name = "pixeldebh"
version = "1.18.1"
description = "PixelDebh: Retro-Rescue! - arcade platformer"
authors = ["Simone Pizzi - Runtime Multimedia"]
license = "MIT"
repository = "https://github.com/Pitz72/PixelDebhTheGame"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pixeldebh_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
